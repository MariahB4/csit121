<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact the Island Guide</title>
    <link rel="stylesheet" href="styles7.css">
</head>
<body>
    <nav>
        <a href="tierlist.html">Tier List</a> |🤎|
        <a href="contact.html">Contact Me</a>
    </nav>

    <main>
        <h1>Islander Feedback Form 🎀</h1>
        <p>Do you agree with my rankings? Let me know who your favorite is!</p>

        <form action="#" method="post">
            <fieldset>
                <legend>Your Details</legend>
                
                <p>
                    <label for="full-name">Name:</label>
                    <input type="text" id="full-name" name="full-name" placeholder="Enter name" required>
                </p>

                <p>
                    <label for="email-address">Email:</label>
                    <input type="email" id="email-address" name="email-address" placeholder="hello@example.com" required>
                </p>

                <p>
                    <label for="fav-islander">Choose your favorite character:</label>
                    <select id="fav-islander" name="fav-islander">
                        <option value="">--Select One--</option>
                        <option value="kuromi">Kuromi</option>
                        <option value="cinnamo">Cinnamoroll</option>
                        <option value="hk">Hello Kitty</option>
                        <option value="se">Someone Else!</option>
                    </select>
                </p>

                <button type="submit">Submit Feedback</button>
            </fieldset>
        </form>
    </main>
</body>
</html>
